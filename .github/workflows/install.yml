name: Install

on:
  workflow_run:
    workflows: ["Build & Release Toga App"]
    types:
      - completed

jobs:
  install:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            ext: dmg
          - os: ubuntu-22.04
            ext: flatpak
          - os: windows-latest
            ext: exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest release asset URL
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            let asset;

            if ("${{ matrix.ext }}" === "exe") {
              asset = release.assets.find(a =>
                a.name.toLowerCase().endsWith(".exe") &&
                a.name.toLowerCase() === "riamu.mail.exe"
              );
            } else if ("${{ matrix.ext }}" === "flatpak") {
              asset = release.assets.find(a =>
                a.name.toLowerCase().endsWith(".flatpak")
              );
            } else {
              asset = release.assets.find(a =>
                a.name.toLowerCase().endsWith(".${{ matrix.ext }}")
              );
            }

            if (!asset) {
              core.setFailed("No asset found for extension: ${{ matrix.ext }}");
            }

            core.setOutput("url", asset.browser_download_url);
            core.setOutput("name", asset.name);

      # -----------------------
      # Download asset
      # -----------------------
      - name: Download release asset (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -L "${{ steps.release.outputs.url }}" -o "${{ steps.release.outputs.name }}"
          ls -lh

      # -----------------------
      # Download release asset (Windows) - all exe files
      # -----------------------
      - name: Download release assets (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $exeAssets = @()
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest" -Headers @{ "Accept" = "application/vnd.github+json" }
          
          foreach ($asset in $release.assets) {
            if ($asset.name.ToLower().EndsWith(".exe")) {
              $exeAssets += $asset
            }
          }

          if ($exeAssets.Count -eq 0) {
            Write-Error "No .exe assets found in the latest release"
            exit 1
          }

          # Create a folder to hold the downloaded .exe files
          New-Item -ItemType Directory -Path app -Force | Out-Null

          # Download each .exe
          foreach ($asset in $exeAssets) {
            $outFile = Join-Path app $asset.name
            Write-Host "Downloading $($asset.name) to $outFile"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $outFile
          }

          # List the downloaded files
          Get-ChildItem app

      # -----------------------
      # Run app on Windows
      # -----------------------
      - name: Run app on Windows
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          # Run the main executable from the app folder
          $exePath = "app\Riamu.Mail.exe"
          if (-Not (Test-Path $exePath)) {
            Write-Error "Riamu.Mail.exe not found in app folder"
            exit 1
          }

          Start-Process -FilePath $exePath
          Start-Sleep -Seconds 15

          # Take a screenshot
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bmp = New-Object System.Drawing.Bitmap(
            [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width,
            [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height
          )
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.CopyFromScreen(0,0,0,0,$bmp.Size)
          $bmp.Save("screenshot-windows.png")

      # -----------------------
      # macOS: mount dmg and run app
      # -----------------------
      - name: Install on macOS
        if: matrix.os == 'macos-latest'
        run: |
          hdiutil attach "${{ steps.release.outputs.name }}"

          APP_PATH=$(find /Volumes -name "*.app" -maxdepth 3 | head -n 1)
          echo "Found app at: $APP_PATH"

          cp -R "$APP_PATH" /Applications/

          EXEC=$(find /Applications -name "*.app" -maxdepth 2 | head -n 1)/Contents/MacOS/*
          echo "Launching: $EXEC"
          "$EXEC" &

          sleep 15
          screencapture -x screenshot-macos.png

      # -----------------------
      # Linux: run Flatpak
      # -----------------------
      - name: Run on Ubuntu (Flatpak)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak scrot xvfb

          # Install the bundle
          flatpak install --user --noninteractive ./${{ steps.release.outputs.name }}

          # List installed apps in the user environment
          APP_ID=$(flatpak list --user --app --columns=application | grep riamumail || true)

          if [ -z "$APP_ID" ]; then
            echo "Failed to get Flatpak app ID"
            exit 1
          fi

          echo "Launching Flatpak app: $APP_ID"

          xvfb-run -a bash -c "
            flatpak run $APP_ID &
            sleep 15
            scrot screenshot-linux.png
          "

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.os }}
          path: |
            screenshot-*.png
