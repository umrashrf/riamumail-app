name: Install

on:
  workflow_run:
    workflows: ["Build & Release Toga App"]
    types:
      - completed

jobs:
  install:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            ext: dmg
          - os: ubuntu-22.04
            ext: flatpak
          - os: windows-latest
            ext: msi

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest release asset URL
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            let asset;

            if ("${{ matrix.ext }}" === "msi") {
              asset = release.assets.find(a =>
                a.name.toLowerCase().endsWith(".msi")
              );
            } else if ("${{ matrix.ext }}" === "flatpak") {
              asset = release.assets.find(a =>
                a.name.toLowerCase().endsWith(".flatpak")
              );
            } else {
              asset = release.assets.find(a =>
                a.name.toLowerCase().endsWith(".${{ matrix.ext }}")
              );
            }

            if (!asset) {
              core.setFailed("No asset found for extension: ${{ matrix.ext }}");
            }

            core.setOutput("url", asset.browser_download_url);
            core.setOutput("name", asset.name);

      # -----------------------
      # Download asset
      # -----------------------
      - name: Download release asset (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -L "${{ steps.release.outputs.url }}" -o "${{ steps.release.outputs.name }}"
          ls -lh

      # -----------------------
      # Download release asset (Windows) - all exe files
      # -----------------------
      - name: Download release assets (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "${{ steps.release.outputs.url }}" `
            -OutFile "${{ steps.release.outputs.name }}"
          Get-ChildItem

      # -----------------------
      # Windows: install MSI and run app
      # -----------------------
      - name: Install and run app on Windows
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $msi = "${{ steps.release.outputs.name }}"

          if (-Not (Test-Path $msi)) {
            Write-Error "MSI not found: $msi"
            exit 1
          }

          Write-Host "Installing $msi in quiet mode..."
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn" -Wait

          # Try to find the installed executable
          $appPath = "C:\Program Files\Riamu Mail\Riamu.Mail.exe"
          if (-Not (Test-Path $appPath)) {
            Write-Host "Default path not found, searching..."
            $appPath = Get-ChildItem "C:\Program Files" -Recurse -Filter "Riamu.Mail.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }

          if (-Not $appPath) {
            Write-Error "Installed executable not found"
            exit 1
          }

          Write-Host "Launching: $appPath"
          Start-Process -FilePath $appPath
          Start-Sleep -Seconds 15

          # Take screenshot
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bmp = New-Object System.Drawing.Bitmap(
            [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width,
            [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height
          )
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.CopyFromScreen(0,0,0,0,$bmp.Size)
          $bmp.Save("screenshot-windows.png")

      # -----------------------
      # macOS: mount dmg and run app
      # -----------------------
      - name: Install on macOS
        if: matrix.os == 'macos-latest'
        run: |
          # Mount the dmg
          hdiutil attach "${{ steps.release.outputs.name }}"

          # Find the .app inside the mounted volume
          APP_PATH=$(find /Volumes -type d -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"

          # Copy app to /Applications
          cp -R "$APP_PATH" /Applications/

          # Find the actual executable inside the .app bundle
          EXEC=$(find "/Applications/$(basename "$APP_PATH")/Contents/MacOS" -type f | head -n 1)
          echo "Launching executable: $EXEC"

          # Launch the app
          "$EXEC" &

          # Wait a bit and take a screenshot
          sleep 15
          screencapture -x screenshot-macos.png

      # -----------------------
      # Linux: run Flatpak
      # -----------------------
      - name: Run on Ubuntu (Flatpak)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak scrot xvfb

          # Install the bundle
          flatpak install --user --noninteractive ./${{ steps.release.outputs.name }}

          # List installed apps in the user environment
          APP_ID=$(flatpak list --user --app --columns=application | grep riamumail || true)

          if [ -z "$APP_ID" ]; then
            echo "Failed to get Flatpak app ID"
            exit 1
          fi

          echo "Launching Flatpak app: $APP_ID"

          xvfb-run -a bash -c "
            flatpak run $APP_ID &
            sleep 15
            scrot screenshot-linux.png
          "

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.os }}
          path: |
            screenshot-*.png
