name: Install

on:
  workflow_run:
    workflows: ["Build & Release Toga App"]
    types:
      - completed

jobs:
  install:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            ext: dmg
          - os: ubuntu-22.04
            ext: appimage
          - os: windows-latest
            ext: exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest release asset URL
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            let asset;

            if ("${{ matrix.ext }}" === "exe") {
              asset = release.assets.find(a =>
                a.name.toLowerCase().endsWith(".exe") &&
                !a.name.toLowerCase().includes("normalizer")
              );
            } else if ("${{ matrix.ext }}" === "appimage") {
              asset = release.assets.find(a =>
                a.name.toLowerCase().endsWith(".appimage")
              );
            } else {
              asset = release.assets.find(a =>
                a.name.toLowerCase().endsWith(".${{ matrix.ext }}")
              );
            }

            if (!asset) {
              core.setFailed("No asset found for extension: ${{ matrix.ext }}");
            }

            core.setOutput("url", asset.browser_download_url);
            core.setOutput("name", asset.name);

      # -----------------------
      # Download asset
      # -----------------------
      - name: Download release asset (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -L "${{ steps.release.outputs.url }}" -o "${{ steps.release.outputs.name }}"
          ls -lh

      - name: Download release asset (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "${{ steps.release.outputs.url }}" `
            -OutFile "${{ steps.release.outputs.name }}"
          Get-ChildItem

      # -----------------------
      # macOS: mount dmg and run app
      # -----------------------
      - name: Install on macOS
        if: matrix.os == 'macos-latest'
        run: |
          hdiutil attach "${{ steps.release.outputs.name }}"

          APP_PATH=$(find /Volumes -name "*.app" -maxdepth 3 | head -n 1)
          echo "Found app at: $APP_PATH"

          cp -R "$APP_PATH" /Applications/

          EXEC=$(find /Applications -name "*.app" -maxdepth 2 | head -n 1)/Contents/MacOS/*
          echo "Launching: $EXEC"
          "$EXEC" &

          sleep 15
          screencapture -x screenshot-macos.png

      # -----------------------
      # Linux: run AppImage
      # -----------------------
      - name: Run on Ubuntu (AppImage)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y scrot xvfb

          chmod +x "${{ steps.release.outputs.name }}"

          xvfb-run -a bash -c "
            ./'${{ steps.release.outputs.name }}' &
            sleep 15
            scrot screenshot-linux.png
          "

      # -----------------------
      # Windows: run exe directly
      # -----------------------
      - name: Run app on Windows
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Start-Process -FilePath "${{ steps.release.outputs.name }}"
          Start-Sleep -Seconds 15

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bmp = New-Object System.Drawing.Bitmap(
            [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width,
            [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height
          )
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.CopyFromScreen(0,0,0,0,$bmp.Size)
          $bmp.Save("screenshot-windows.png")

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.os }}
          path: |
            screenshot-*.png
