[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riamumail"
version = "0.5.6"
description = "Self hosted mail server running on port 36245, email was meant to be distributed and not owned"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Umair Ashraf", email = "umair@ashraf.riamumail.com"}
]
keywords = ["email", "mail-server", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies that work across all platforms
dependencies = [
    "toga>=0.5.0,<0.6.0",
    "requests>=2.25.0",
    "miniupnpc>=2.3.3",
]

[project.optional-dependencies]
# Platform-specific dependencies
macos = [
    "toga-cocoa>=0.5.0,<0.6.0",
    "std-nslog>=1.0.0,<2.0.0",
]
windows = [
    "toga-winforms>=0.5.0,<0.6.0",
]
linux = [
    "toga-gtk>=0.5.0,<0.6.0",
    "pygobject<3.52.1",  # Compatibility with Debian 12/Ubuntu 22.04
]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
# All platform dependencies (useful for testing)
all = [
    "toga-cocoa>=0.5.0,<0.6.0",
    "std-nslog>=1.0.0,<2.0.0",
    "toga-winforms>=0.5.0,<0.6.0",
    "toga-gtk>=0.5.0,<0.6.0",
    "pygobject<3.52.1",
]

[project.urls]
Homepage = "https://email.riamu.io"
Repository = "https://github.com/yourusername/riamumail"
Documentation = "https://email.riamu.io/docs"
"Bug Tracker" = "https://github.com/yourusername/riamumail/issues"

[project.scripts]
riamumail = "riamumail.app:main"

[tool.setuptools]
packages = ["riamumail"]

[tool.setuptools.package-dir]
riamumail = "src/riamumail"

[tool.setuptools.package-data]
riamumail = ["resources/*", "resources/**/*"]

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=riamumail --cov-report=term-missing"

# black code formatter configuration
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# mypy type checker configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

# coverage configuration
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
